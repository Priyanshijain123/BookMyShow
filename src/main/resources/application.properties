spring.application.name=BookMyShow
server.port=8080

# Local persistent database. Set BOOKING_DB_URL/USERNAME/PASSWORD to use a shared database such as PostgreSQL.
spring.datasource.url=${BOOKING_DB_URL:jdbc:h2:file:./data/bookmyshow;AUTO_SERVER=TRUE}
spring.datasource.username=${BOOKING_DB_USERNAME:sa}
spring.datasource.password=${BOOKING_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Prices are in paise (20000 = INR 200).
booking.ticket-price-minor=20000
booking.discount.eligible-cities=Mumbai
booking.discount.eligible-theaters=

# Leave this empty for local development without AWS.
booking.sqs.queue-url=
